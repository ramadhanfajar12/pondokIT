<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f5f5f5;
            padding: 30px;
        }

        .container {
            width: 1100px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #1d4f91;
            font-size: 48px;
        }

        .subjudul {
            text-align: center;
            color: red;
            margin-bottom: 25px;
            font-size: 18px;
        }

        .judul {
            font-size: 40px;
            margin-bottom: 20px;
        }

        .wrapper {
            display: flex;
            gap: 20px;
        }

        /* FOTO */

        .foto {
            width: 350px;
            background: #fff;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, .2);
            padding: 15px;
            text-align: center;
        }

        .foto h2 {
            color: #1d4f91;
            margin-bottom: 15px;
        }

        .foto img {
            width: 270px;
            height: 270px;
            border: 1px solid #ddd;
            object-fit: cover;
        }

        .btn {
            margin-top: 15px;
            background: #0d6efd;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
        }

        .ket {
            margin-top: 15px;
            color: green;
            font-size: 14px;
            line-height: 25px;
        }

        /* FORM */

        .form {
            flex: 1;
            background: #fff;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, .2);
            padding: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        textarea {
            resize: none;
            height: 70px;
        }

        .full {
            grid-column: 1/3;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Form Pendaftaran</h1>

        <p class="subjudul">
            web petunjuk Pendaftaran
        </p>

        <h2 class="judul">👤 Data Diri</h2>

        <div class="wrapper">

            <!-- FOTO -->

            <div class="foto">

                <h2>Foto Anda</h2>

                <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png">

                <br>

                <button class="btn">
                    Upload Foto
                </button>

                <p class="ket">
                    Hanya file cdn-icons-png,
                    Upload Pas Photo minimal 4x6.
                </p>

            </div>

            <!-- FORM -->

            <div class="form">

                <div class="grid">

                    <div>
                        <label>Nama Lengkap</label>
                        <input type="text" placeholder="Masukan nama">
                    </div>

                    <div>
                        <label>Gelombang</label>
                        <select>
                            <option>-- Pilih --</option>
                            <option>Gelombang 1</option>
                            <option>Gelombang 2</option>
                            <option>Gelombang 3</option>
                        </select>
                    </div>

                    <div>
                        <label>Tahun Pendaftaran</label>
                        <select>
                            <option>2027</option>
                            <option>2028</option>
                        </select>
                    </div>

                    <div>
                        <label>Jenis Kelamin</label>
                        <select>
                            <option>--Pilih--</option>
                            <option>Laki-laki</option>
                            <option>Perempuan</option>
                        </select>
                    </div>

                    <div>
                        <label>Sudah Lulus / Masih Sekolah</label>
                        <select>
                            <option>Sudah Lulus Sekolah</option>
                            <option>Masih Sekolah</option>
                        </select>
                    </div>

                    <div>
                        <label>Tanggal Lahir</label>
                        <input type="date">
                    </div>

                    <div>
                        <label>Provinsi</label>
                        <select>
                            <option>Jakarta</option>
                            <option>Jawa Timur</option>
                            <option>Jawa Barat</option>
                            <option>Jawa Tengah</option>
                            <option>kalimantan</option>
                            <option>sumatera</option>
                            <option>sulawesi</option>
                            <option>papua</option>
                        </select>
                    </div>

                    <div>
                        <label>Jurusan Yang Dituju</label>
                        <select>
                            <option>Pilih Jurusan</option>
                            <option>Programmer</option>
                            <option>Backend</option>
                            <option>Frontend</option>
                            <option>Mobile Developer</option>
                            <option>Bisnis Digital</option>
                        </select>
                    </div>

                    <div class="full">
                        <label>Hobi</label>
                        <input type="text">
                    </div>

                    <div>
                        <label>Cita - Cita</label>
                        <textarea></textarea>
                    </div>

                    <div>
                        <label>Alamat Rumah</label>
                        <textarea placeholder="Ex : Jl. Wijoyo Mulyo No.64 Rt/Rw 02/06 Banguntapan..."></textarea>
                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
